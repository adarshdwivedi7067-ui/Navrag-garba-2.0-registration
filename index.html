<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navrang Garba 2.0 - Pass Registration</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f8; display: flex; justify-content: center; padding: 20px; }
    .form-container { background: #ffffff; padding: 25px; border-radius: 8px; width: 100%; max-width: 450px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; color: #333; font-size: 14px; }
    select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    .amount-box { background-color: #eef3f8; text-align: center; padding: 15px; border-radius: 6px; margin: 15px 0; }
    .amount-title { font-size: 13px; color: #666; }
    .amount-value { font-size: 26px; font-weight: bold; color: #111; margin-top: 4px; }
    .upi-info { text-align: center; font-size: 13px; color: #555; margin-bottom: 12px; }
    .pay-btn { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; text-decoration: none; display: inline-block; text-align: center; box-sizing: border-box; }
    .pay-btn.disabled { background-color: #a0b2c6; cursor: not-allowed; pointer-events: none; }
    .step-2 { margin-top: 25px; padding-top: 20px; border-top: 2px dashed #ddd; }
    .submit-btn { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .submit-btn:disabled { background-color: #94d3a2; cursor: not-allowed; }
    #statusMsg { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

  <div class="form-container">
    <h2 style="text-align: center; margin-top: 0; color: #333;">Navrang Garba 2.0</h2>
    <form id="registrationForm">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" required>
      </div>

      <div class="form-group">
        <label for="gender">Select Gender</label>
        <select id="gender" required>
          <option value="" disabled selected>Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" required>
      </div>

      <div class="form-group">
        <label for="passType">Select Pass Type</label>
        <select id="passType" required>
          <option value="" disabled selected>Choose a pass</option>
          <option value="299">Audience Pass - ₹299</option>
          <option value="399">Freestyle Pass - ₹399</option>
          <option value="499">Participant Pass - ₹499</option>
        </select>
      </div>

      <div class="amount-box">
        <div class="amount-title">Total Amount</div>
        <div class="amount-value" id="totalAmount">₹0</div>
      </div>

      <div class="upi-info">
        Payment UPI ID: <strong>dwivediadarsh628@okaxis</strong>
      </div>

      <a id="payBtn" class="pay-btn disabled" href="#">SELECT PASS FIRST</a>

      <div class="step-2">
        <div class="form-group">
          <label for="utr">UTR / Transaction ID (After Payment)</label>
          <input type="text" id="utr" placeholder="Enter 12-digit UTR ID" required>
        </div>

        <div class="form-group">
          <label for="screenshot">Payment Screenshot</label>
          <input type="file" id="screenshot" accept="image/*" required>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">SUBMIT REGISTRATION</button>
      </div>

      <div id="statusMsg"></div>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://rdjdsqlawhawoywgvyro.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_c_uKHsH5pKT8TyKa1IqC-g_-nLUMI5W';
    const BUCKET_NAME = 'screenshots';
    const TABLE_NAME = 'registrations';

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const passSelect = document.getElementById('passType');
    const amountDisplay = document.getElementById('totalAmount');
    const payButton = document.getElementById('payBtn');
    const upiId = "dwivediadarsh628@okaxis";

    function updatePassPrice() {
      const price = passSelect.value;
      
      if (price) {
        const selectedText = passSelect.options[passSelect.selectedIndex].text;
        const passName = selectedText.split('-')[0].trim();

        amountDisplay.innerText = `₹${price}`;
        payButton.innerText = `PAY ₹${price} VIA UPI`;
        payButton.classList.remove('disabled');
        
        const upiUrl = `upi://pay?pa=${upiId}&pn=Adarsh%20Dwivedi&am=${price}&cu=INR&tn=${encodeURIComponent(passName)}`;
        payButton.setAttribute('href', upiUrl);
      } else {
        amountDisplay.innerText = '₹0';
        payButton.innerText = 'SELECT PASS FIRST';
        payButton.classList.add('disabled');
        payButton.setAttribute('href', '#');
      }
    }

    passSelect.addEventListener('change', updatePassPrice);
    passSelect.addEventListener('input', updatePassPrice);

    const form = document.getElementById('registrationForm');
    const statusMsg = document.getElementById('statusMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";
      statusMsg.style.color = "blue";
      statusMsg.innerText = "Processing registration...";

      try {
        const fileInput = document.getElementById('screenshot');
        const file = fileInput.files[0];
        const fileName = `${Date.now()}_${file.name}`;

        const { data: uploadData, error: uploadError } = await supabase.storage
          .from(BUCKET_NAME)
          .upload(fileName, file);

        if (uploadError) throw uploadError;

        const { data: publicUrlData } = supabase.storage
          .from(BUCKET_NAME)
          .getPublicUrl(fileName);

        const screenshotUrl = publicUrlData.publicUrl;

        const { data, error: insertError } = await supabase
          .from(TABLE_NAME)
          .insert([
            {
              full_name: document.getElementById('fullName').value,
              phone: document.getElementById('phone').value,
              gender: document.getElementById('gender').value,
              dob: document.getElementById('dob').value,
              pass_type: passSelect.options[passSelect.selectedIndex].text,
              amount: amountDisplay.innerText,
              utr: document.getElementById('utr').value,
              screenshot_url: screenshotUrl,
              status: 'pending'
            }
          ]);

        if (insertError) throw insertError;

        statusMsg.style.color = "green";
        statusMsg.innerText = "Registration Successful!";
        form.reset();
        amountDisplay.innerText = "₹0";
        payButton.innerText = "SELECT PASS FIRST";
        payButton.classList.add('disabled');

      } catch (err) {
        console.error("Error:", err);
        statusMsg.style.color = "red";
        statusMsg.innerText = "Error: " + (err.message || "Failed to submit.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "SUBMIT REGISTRATION";
      }
    });
  </script>
</body>
</html>
