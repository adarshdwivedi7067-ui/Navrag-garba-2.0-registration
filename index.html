<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Pass Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .form-container {
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: #333;
    }
    select, input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .amount-box {
      background-color: #eef3f8;
      text-align: center;
      padding: 15px;
      border-radius: 6px;
      margin-top: 10px;
    }
    .amount-title {
      font-size: 14px;
      color: #666;
    }
    .amount-value {
      font-size: 28px;
      font-weight: bold;
      color: #111;
      margin-top: 4px;
    }
    .pay-btn {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background-color: #4b6b94;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
    }
    .pay-btn:disabled {
      background-color: #a0b2c6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <div class="form-group">
      <label for="gender">Select Gender</label>
      <select id="gender">
        <option value="" disabled selected>Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label for="dob">Date of Birth</label>
      <input type="date" id="dob">
    </div>

    <!-- Main Dropdown Logic -->
    <div class="form-group">
      <label for="passType">Select Pass Type</label>
      <select id="passType">
        <option value="" disabled selected>Choose a pass</option>
        <option value="399">Freestyle Pass — ₹399</option>
        <option value="599">VIP Pass — ₹599</option>
        <option value="999">All Access Pass — ₹999</option>
      </select>
    </div>

    <div class="amount-box">
      <div class="amount-title">Total Amount</div>
      <div class="amount-value" id="totalAmount">₹0</div>
    </div>

    <button id="payBtn" class="pay-btn" disabled>SELECT PASS FIRST</button>
  </div>

  <script>
    const passSelect = document.getElementById('passType');
    const amountDisplay = document.getElementById('totalAmount');
    const payButton = document.getElementById('payBtn');

    // Dropdown change hone par amount update karne ka logic
    passSelect.addEventListener('change', function() {
      const selectedPrice = this.value;

      if (selectedPrice) {
        amountDisplay.innerText = `₹${selectedPrice}`;
        payButton.innerText = `PAY ₹${selectedPrice}`;
        payButton.disabled = false;
      } else {
        amountDisplay.innerText = '₹0';
        payButton.innerText = 'SELECT PASS FIRST';
        payButton.disabled = true;
      }
    });
  </script>

</body>
</html>
