<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Navrang Garba 2.0 - Registration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    .amount-box {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: #f1f1f1;
      text-align: center;
    }

    .amount-title {
      font-size: 15px;
      color: #666;
    }

    .amount {
      font-size: 30px;
      font-weight: bold;
      margin-top: 5px;
    }

    .upi-box {
      margin-top: 18px;
      padding: 16px;
      text-align: center;
      border-radius: 12px;
      background: #eeeeee;
    }

    .upi-id {
      font-size: 18px;
      font-weight: bold;
      margin-top: 7px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 15px;
      margin-top: 18px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #payButton {
      background: #222;
      color: white;
    }

    #payButton:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #submitButton {
      background: #198754;
      color: white;
    }

    #message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
    }

    .note {
      margin-top: 10px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎉 NAVRANG GARBA 2.0</h1>
  <div class="subtitle">Online Registration</div>

  <form id="registrationForm">

    <!-- NAME -->
    <label>Full Name</label>
    <input
      type="text"
      id="name"
      placeholder="Enter your full name"
      required
    >

    <!-- MOBILE -->
    <label>Mobile Number</label>
    <input
      type="tel"
      id="mobile"
      placeholder="10 digit mobile number"
      maxlength="10"
      inputmode="numeric"
      required
    >

    <!-- GENDER -->
    <label>Gender</label>
    <select id="gender" required>
      <option value="">Select Gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>

    <!-- DOB -->
    <label>Date of Birth</label>
    <input
      type="date"
      id="dob"
      required
    >

    <!-- PASS -->
    <label>Select Pass Type</label>

    <select id="pass_type" required>

      <option value="" data-amount="0">
        -- Select Pass --
      </option>

      <option
        value="Participant Pass"
        data-amount="499"
      >
        Participant Pass — ₹499
      </option>

      <option
        value="Freestyle Pass"
        data-amount="399"
      >
        Freestyle Pass — ₹399
      </option>

      <option
        value="Audience Pass"
        data-amount="299"
      >
        Audience Pass — ₹299
      </option>

    </select>


    <!-- AUTOMATIC AMOUNT -->
    <div class="amount-box">

      <div class="amount-title">
        Total Amount
      </div>

      <div class="amount">
        ₹<span id="amount">0</span>
      </div>

    </div>


    <!-- UPI -->
    <div class="upi-box">

      <div>💳 Payment UPI ID</div>

      <div class="upi-id">
        dwivediadarsh628@okaxis
      </div>

    </div>


    <!-- PAY BUTTON -->
    <button
      type="button"
      id="payButton"
      disabled
    >
      💳 SELECT PASS FIRST
    </button>

    <div class="note">
      Payment button mobile me UPI app open karega.
    </div>


    <!-- UTR -->
    <label>UTR / Transaction ID</label>

    <input
      type="text"
      id="utr"
      placeholder="Enter UTR / Transaction ID"
      required
    >


    <!-- SCREENSHOT -->
    <label>Payment Screenshot</label>

    <input
      type="file"
      id="screenshot"
      accept="image/*"
      required
    >


    <!-- SUBMIT -->
    <button
      type="submit"
      id="submitButton"
    >
      ✅ SUBMIT REGISTRATION
    </button>

  </form>


  <div id="message"></div>

</div>


<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://rdjdsqlawhawoywgvyro.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    sb_publishable_c_uKHsH5pKT8TyKa1IqC-g_-nLUMI5W";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  // ==========================================
  // ELEMENTS
  // ==========================================

  const passType =
    document.getElementById("pass_type");

  const amount =
    document.getElementById("amount");

  const payButton =
    document.getElementById("payButton");

  const form =
    document.getElementById("registrationForm");

  const message =
    document.getElementById("message");


  // ==========================================
  // PASS SELECT → AUTOMATIC AMOUNT
  // ==========================================

  passType.addEventListener("change", function () {

    const selectedOption =
      this.options[this.selectedIndex];

    const selectedAmount =
      Number(
        selectedOption.getAttribute("data-amount")
      );


    // Show amount
    amount.innerText =
      selectedAmount;


    // Update payment button
    if (selectedAmount > 0) {

      payButton.disabled = false;

      payButton.innerText =
        "💳 PAY ₹" + selectedAmount + " NOW";

    } else {

      payButton.disabled = true;

      payButton.innerText =
        "💳 SELECT PASS FIRST";

    }

  });


  // ==========================================
  // UPI PAYMENT
  // ==========================================

  payButton.addEventListener("click", function () {

    const selectedOption =
      passType.options[passType.selectedIndex];

    const selectedAmount =
      Number(
        selectedOption.getAttribute("data-amount")
      );


    if (!selectedAmount) {

      alert("Please select a pass first.");

      return;

    }


    const upiId =
      "dwivediadarsh628@okaxis";

    const name =
      "Navrang Garba 2.0";


    const upiUrl =
      "upi://pay" +
      "?pa=" + encodeURIComponent(upiId) +
      "&pn=" + encodeURIComponent(name) +
      "&am=" + selectedAmount +
      "&cu=INR";


    // Open UPI payment
    window.location.href =
      upiUrl;

  });


  // ==========================================
  // FORM SUBMIT
  // ==========================================

  form.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();


      message.innerHTML =
        "⏳ Please wait... Registration submitting.";


      try {

        // --------------------------------------
        // GET FORM DATA
        // --------------------------------------

        const name =
          document.getElementById("name")
            .value.trim();

        const mobile =
          document.getElementById("mobile")
            .value.trim();

        const gender =
          document.getElementById("gender")
            .value;

        const dob =
          document.getElementById("dob")
            .value;

        const pass =
          passType.value;

        const selectedOption =
          passType.options[
            passType.selectedIndex
          ];

        const selectedAmount =
          Number(
            selectedOption
              .getAttribute("data-amount")
          );

        const utr =
          document.getElementById("utr")
            .value.trim();

        const screenshot =
          document.getElementById("screenshot")
            .files[0];


        // --------------------------------------
        // VALIDATION
        // --------------------------------------

        if (!name) {
          throw new Error(
            "Please enter your name."
          );
        }


        if (!/^[0-9]{10}$/.test(mobile)) {
          throw new Error(
            "Please enter a valid 10 digit mobile number."
          );
        }


        if (!pass || selectedAmount === 0) {
          throw new Error(
            "Please select a pass."
          );
        }


        if (!utr) {
          throw new Error(
            "Please enter UTR / Transaction ID."
          );
        }


        if (!screenshot) {
          throw new Error(
            "Please upload payment screenshot."
          );
        }


        // --------------------------------------
        // INSERT REGISTRATION
        // --------------------------------------

        const {
          data,
          error
        } = await supabaseClient

          .from("Registration")

          .insert([{

            name: name,

            mobile: mobile,

            gender: gender,

            dob: dob,

            pass_type: pass,

            amount: selectedAmount,

            utr: utr,

            payment_status: "pending",

            pass_status: "not_generated"

          }])

          .select()

          .single();


        if (error) {
          throw error;
        }


        // --------------------------------------
        // UPLOAD SCREENSHOT
        // --------------------------------------

        const safeFileName =
          screenshot.name
            .replace(/[^a-zA-Z0-9._-]/g, "_");


        const filePath =
          data.id +
          "/payment_" +
          Date.now() +
          "_" +
          safeFileName;


        const {
          error: uploadError
        } = await supabaseClient

          .storage

          .from("payment-screenshots")

          .upload(
            filePath,
            screenshot
          );


        if (uploadError) {
          throw uploadError;
        }


        // --------------------------------------
        // SAVE SCREENSHOT PATH
        // --------------------------------------

        const {
          error: updateError
        } = await supabaseClient

          .from("Registration")

          .update({

            payment_screenshot:
              filePath

          })

          .eq(
            "id",
            data.id
          );


        if (updateError) {
          throw updateError;
        }


        // --------------------------------------
        // SUCCESS
        // --------------------------------------

        message.innerHTML =
          "✅ REGISTRATION SUCCESSFUL!<br><br>" +

          "Your payment is pending verification.<br>" +

          "Admin payment verify karega.<br>" +

          "Uske baad final pass generate hoga.";


        form.reset();

        amount.innerText =
          "0";

        payButton.disabled =
          true;

        payButton.innerText =
          "💳 SELECT PASS FIRST";


      }

      catch (error) {

        console.error(error);

        message.innerHTML =
          "❌ Registration failed.<br><br>" +
          error.message;

      }

    }

  );

</script>

</body>
</html>
