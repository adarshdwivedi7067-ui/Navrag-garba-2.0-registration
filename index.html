<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navrang Garba 2.0 - Registration</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-6 md:p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-amber-400 to-rose-500 bg-clip-text text-transparent">Navrang Garba 2.0</h1>
            <p class="text-sm text-slate-400 mt-1">Secure Your Pass Now</p>
        </div>

        <form id="registrationForm" class="space-y-4">
            <!-- Personal Details -->
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Full Name *</label>
                <input type="text" id="fullName" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="Enter your full name">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Phone Number (WhatsApp) *</label>
                <input type="tel" id="phone" required pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="10-digit mobile number">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Pass Type & Amount *</label>
                <select id="passType" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500" onchange="updateAmount()">
                    <option value="" disabled selected>Select Pass Type</option>
                    <option value="Single Pass - ₹300">Single Pass - ₹300</option>
                    <option value="Couple Pass - ₹500">Couple Pass - ₹500</option>
                    <option value="VIP Pass - ₹1000">VIP Pass - ₹1000</option>
                </select>
            </div>

            <!-- STEP 1: UPI Payment Section -->
            <div class="border border-amber-500/30 bg-amber-500/5 rounded-xl p-4 text-center space-y-3">
                <p class="text-xs text-amber-300 font-medium">Step 1: Pay securely using any UPI App</p>
                
                <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 flex items-center justify-between">
                    <span id="displayUpi" class="text-sm font-mono text-amber-400 font-bold">your-upi-id@paytm</span>
                    <button type="button" onclick="copyUpi()" class="text-xs bg-amber-500 text-slate-950 font-semibold px-3 py-1.5 rounded hover:bg-amber-400 transition">Copy UPI</button>
                </div>

                <a id="upiPayLink" href="#" target="_blank" class="block w-full bg-rose-600 hover:bg-rose-500 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-lg text-center">
                    🚀 Pay Now via GPay / PhonePe / Paytm
                </a>
            </div>

            <!-- STEP 2: Mandatory Payment Confirmation Check -->
            <div class="space-y-3 pt-2">
                <label class="flex items-start gap-2 text-xs text-slate-300 cursor-pointer bg-slate-800/60 p-3 rounded-lg border border-slate-700">
                    <input type="checkbox" id="paymentConfirmCheck" required onchange="toggleUtrSection()" class="mt-0.5 accent-amber-500 w-4 h-4">
                    <span>I confirm that I have successfully completed the UPI payment *</span>
                </label>
            </div>

            <!-- STEP 3: UTR & Submission (Hidden & Disabled until confirmation is checked) -->
            <div id="utrSection" class="space-y-4 opacity-50 pointer-events-none transition-all duration-300">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">UPI Transaction / UTR ID (12 Digits) *</label>
                    <input type="text" id="utrId" minlength="12" maxlength="12" pattern="[0-9]{12}" title="UTR must be exactly 12 digits" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500 font-mono" placeholder="Enter 12-digit UTR number">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Payment Screenshot Link / Image URL *</label>
                    <input type="text" id="screenshotUrl" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="Paste image link">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-lg">
                    Submit Registration
                </button>
            </div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const MERCHANT_UPI = 'your-upi-id@paytm'; // Apni asli UPI ID yahan daalein
        const MERCHANT_NAME = 'NavrangGarba';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function updateAmount() {
            const passType = document.getElementById('passType').value;
            let amount = 300;
            if (passType.includes('500')) amount = 500;
            if (passType.includes('1000')) amount = 1000;

            const upiLink = `upi://pay?pa=${MERCHANT_UPI}&pn=${MERCHANT_NAME}&am=${amount}&cu=INR`;
            document.getElementById('upiPayLink').href = upiLink;
        }

        function copyUpi() {
            navigator.clipboard.writeText(MERCHANT_UPI);
            alert('UPI ID copied to clipboard!');
        }

        function toggleUtrSection() {
            const isChecked = document.getElementById('paymentConfirmCheck').checked;
            const utrSection = document.getElementById('utrSection');
            const utrInput = document.getElementById('utrId');
            const screenshotInput = document.getElementById('screenshotUrl');

            if (isChecked) {
                utrSection.classList.remove('opacity-50', 'pointer-events-none');
                utrInput.required = true;
                screenshotInput.required = true;
            } else {
                utrSection.classList.add('opacity-50', 'pointer-events-none');
                utrInput.required = false;
                screenshotInput.required = false;
                utrInput.value = '';
                screenshotInput.value = '';
            }
        }

        window.onload = updateAmount;

        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const phone = document.getElementById('phone').value;
            const passType = document.getElementById('passType').value;
            const utrId = document.getElementById('utrId').value;
            const screenshotUrl = document.getElementById('screenshotUrl').value;

            if(utrId.length !== 12) {
                alert('Please enter a valid 12-digit UTR/Transaction ID.');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = 'Submitting...';
            submitBtn.disabled = true;

            const { data, error } = await supabaseClient
                .from('Registration')
                .insert([
                    {
                        Full_Name: fullName,
                        Phone: phone,
                        Pass_Type: passType,
                        UTR_ID: utrId,
                        Screenshot: screenshotUrl,
                        Status: 'Pending'
                    }
                ]);

            if (error) {
                alert('Error submitting registration: ' + error.message);
                submitBtn.textContent = 'Submit Registration';
                submitBtn.disabled = false;
            } else {
                alert('Registration submitted successfully! Your pass will be issued once payment is verified by the admin.');
                document.getElementById('registrationForm').reset();
                toggleUtrSection();
                updateAmount();
                submitBtn.textContent = 'Submit Registration';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
