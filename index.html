<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Navrang Garba 2.0 - Registration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .amount {
      margin-top: 20px;
      padding: 15px;
      background: #f0f0f0;
      border-radius: 10px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .upi {
      margin-top: 15px;
      padding: 15px;
      background: #eee;
      border-radius: 10px;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .pay {
      background: #222;
      color: white;
    }

    .submit {
      background: #198754;
      color: white;
    }

    #message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎉 NAVRANG GARBA 2.0</h1>
  <div class="subtitle">Registration Form</div>

  <form id="registrationForm">

    <label>Full Name</label>
    <input
      type="text"
      id="name"
      required
      placeholder="Enter your name"
    >

    <label>Mobile Number</label>
    <input
      type="tel"
      id="mobile"
      required
      maxlength="10"
      placeholder="10 digit mobile number"
    >

    <label>Gender</label>
    <select id="gender" required>
      <option value="">Select Gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>

    <label>Date of Birth</label>
    <input
      type="date"
      id="dob"
      required
    >

    <label>Pass Type</label>
    <select id="pass_type" required>
      <option value="">Select Pass</option>
      <option value="Participant Pass" data-amount="499">
        Participant Pass - ₹499
      </option>
      <option value="Freestyle Pass" data-amount="399">
        Freestyle Pass - ₹399
      </option>
      <option value="Audience Pass" data-amount="299">
        Audience Pass - ₹299
      </option>
    </select>

    <div class="amount">
      Amount: ₹<span id="amount">0</span>
    </div>

    <div class="upi">
      <b>UPI ID</b><br><br>
      dwivediadarsh628@okaxis
    </div>

    <button
      type="button"
      class="pay"
      onclick="payNow()"
    >
      💳 PAY NOW
    </button>

    <label>UTR / Transaction ID</label>
    <input
      type="text"
      id="utr"
      required
      placeholder="Enter UTR / Transaction ID"
    >

    <label>Payment Screenshot</label>
    <input
      type="file"
      id="screenshot"
      accept="image/*"
      required
    >

    <button
      type="submit"
      class="submit"
    >
      ✅ SUBMIT REGISTRATION
    </button>

  </form>

  <div id="message"></div>

</div>

<script>

  // ==========================================
  // SUPABASE CONFIG
  // ==========================================

  const SUPABASE_URL =
    "https://rdjdsqlawhawoywgvyro.supabase.co";

  const SUPABASE_ANON_KEY =
sb_publishable_c_uKHsH5pKT8TyKa1IqC-g_-nLUMI5W

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // ==========================================
  // PASS AMOUNT
  // ==========================================

  const passSelect =
    document.getElementById("pass_type");

  const amountBox =
    document.getElementById("amount");

  passSelect.addEventListener("change", function() {

    const selected =
      this.options[this.selectedIndex];

    const amount =
      selected.getAttribute("data-amount");

    amountBox.innerText =
      amount || "0";

  });


  // ==========================================
  // UPI PAYMENT
  // ==========================================

  function payNow() {

    const selected =
      passSelect.options[passSelect.selectedIndex];

    const amount =
      selected.getAttribute("data-amount");

    if (!amount) {
      alert("Please select a pass first.");
      return;
    }

    const upiUrl =
      "upi://pay" +
      "?pa=dwivediadarsh628@okaxis" +
      "&pn=Navrang%20Garba%202.0" +
      "&am=" + amount +
      "&cu=INR";

    window.location.href = upiUrl;

  }


  // ==========================================
  // FORM SUBMIT
  // ==========================================

  document
    .getElementById("registrationForm")
    .addEventListener("submit", async function(e) {

      e.preventDefault();

      const message =
        document.getElementById("message");

      message.innerText =
        "⏳ Submitting registration...";

      try {

        const name =
          document.getElementById("name").value.trim();

        const mobile =
          document.getElementById("mobile").value.trim();

        const gender =
          document.getElementById("gender").value;

        const dob =
          document.getElementById("dob").value;

        const passType =
          document.getElementById("pass_type").value;

        const selected =
          passSelect.options[passSelect.selectedIndex];

        const amount =
          Number(
            selected.getAttribute("data-amount")
          );

        const utr =
          document.getElementById("utr").value.trim();

        const screenshot =
          document.getElementById("screenshot").files[0];


        if (!/^[0-9]{10}$/.test(mobile)) {
          throw new Error(
            "Please enter a valid 10 digit mobile number."
          );
        }

        if (!screenshot) {
          throw new Error(
            "Please upload payment screenshot."
          );
        }


        // STEP 1: Save registration

        const { data, error } =
          await supabaseClient
            .from("Registration")
            .insert([{
              name: name,
              mobile: mobile,
              gender: gender,
              dob: dob,
              pass_type: passType,
              amount: amount,
              utr: utr,
              payment_status: "pending",
              pass_status: "not_generated"
            }])
            .select()
            .single();

        if (error) {
          throw error;
        }


        // STEP 2: Upload screenshot

        const filePath =
          data.id +
          "/payment_" +
          Date.now() +
          "_" +
          screenshot.name;

        const { error: uploadError } =
          await supabaseClient
            .storage
            .from("payment-screenshots")
            .upload(
              filePath,
              screenshot
            );

        if (uploadError) {
          throw uploadError;
        }


        // STEP 3: Save screenshot path

        const { error: updateError } =
          await supabaseClient
            .from("Registration")
            .update({
              payment_screenshot: filePath
            })
            .eq("id", data.id);

        if (updateError) {
          throw updateError;
        }


        message.innerHTML =
          "✅ Registration Submitted Successfully!<br><br>" +
          "Payment Status: Pending<br>" +
          "Admin verification ke baad pass generate hoga.";

        document
          .getElementById("registrationForm")
          .reset();

        amountBox.innerText = "0";


      } catch (error) {

        console.error(error);

        message.innerHTML =
          "❌ Registration failed.<br><br>" +
          error.message;

      }

    });

</script>

</body>
</html>
